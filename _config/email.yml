# Fix long strings in e-mails being split over multiple lines with default encoding 'quoted-printable'
# (alternative 'base64' works OK as well, 'plain' equals no special encoding/quoting, eg plaintext which seems to work just fine)
# NOTE: 'plain' is not valid, the only valid type are: Content-Transfer-Encoding := "BASE64" / "QUOTED-PRINTABLE" / "8BIT"   / "7BIT" / "BINARY"
SilverStripe\Control\Email\Mailer:
  default_message_encoding: 'base64'


# Email config: system email sender
# NOTE: moved/duplicated in _config.php since BACKTICKS ENV VARS are only supported via Injector and Email doesn't use injector
---
Name: admintweaks-emailconfig
After:
  - '#emailconfig'
Only:
  envvarset:
    - APP_SYSTEM_EMAIL_SENDER
    - APP_SYSTEM_EMAIL_ADDRESS
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Email\Email:
  #  admin_email: ''
    admin_email:
      '`APP_SYSTEM_EMAIL_ADDRESS`': '`APP_SYSTEM_EMAIL_SENDER`'


# Queuedjobs email notification config (use same address as error logger)
# NOTE: moved/duplicated in _config.php since BACKTICKS ENV VARS are only supported via Injector and Email doesn't use injector
---
Name: admintweaks-qjobsemailconfig
After:
  - '#queuedjobsettings'
Only:
  envvarset:
#    - APP_LOG_MAIL_SENDER
    - APP_LOG_MAIL_RECIPIENT
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Email\Email:
    # 2026-08-31: queuedjobs' EmailService uses queued_job_admin_email primarily as the RECIPIENT of its
    # broken/stalled/missing-default-job reports (createReport(): to; only the missing-job mail also uses it
    # as From). Wiring it to APP_LOG_MAIL_SENDER (a no-reply address) since 1c3b176 sent every queue report
    # into a black hole — it must follow the error-mail RECIPIENT.
#    queued_job_admin_email: '`APP_LOG_MAIL_SENDER`'
    queued_job_admin_email: '`APP_LOG_MAIL_RECIPIENT`'


# SMTP mailer config for SS4 (SwiftMailer)
# For SS5+, use MAILER_DSN in .env instead (e.g., smtp://user:pass@smtp.example.com:587)
---
Name: admintweaks-smtp-email-transport
Only:
  classexists: Swift_SmtpTransport
  envvarset:
    - APP_SMTP_HOST
    - APP_SMTP_PORT
    - APP_SMTP_ENCRYPTION
    - APP_SMTP_USERNAME
    - APP_SMTP_PASSWORD
---
SilverStripe\Core\Injector\Injector:
  Swift_Transport:
    class: Swift_SmtpTransport
    properties:
      Host: '`APP_SMTP_HOST`'
      Port: '`APP_SMTP_PORT`'
      Encryption: '`APP_SMTP_ENCRYPTION`'
    calls:
      Username: [ setUsername, ['`APP_SMTP_USERNAME`'] ]
      Password: [ setPassword, ['`APP_SMTP_PASSWORD`'] ]
      AuthMode: [ setAuthMode, ['login'] ]


# Email error handler — sends error emails via Symfony Mailer with cache-based deduplication.
# Only activates when ALL env vars below are set. To disable on dev/test,
# simply don't define these vars in those environments.
#
# Required in .env (on live only):
#   APP_LOG_MAIL_RECIPIENT="admin@example.com"
#   APP_LOG_MAIL_SUBJECT="Error on MyApp"
#   APP_LOG_MAIL_SENDER="noreply@example.com"
#   APP_LOG_MAIL_LEVEL="error"  # info / warning / error
#
# Features:
# - Enhanced error format with inline-styled HTML + $_SERVER details (like SS3 had)
# - Cache-based deduplication to prevent email bombing (e.g., when DB crashes)
# - Configurable: dedup_time (DedupSymfonyMailerHandler), format_mode (EnhancedErrorFormatter)
---
Name: admintweaks-error-email-logger
Only:
  envvarset:
    - APP_LOG_MAIL_RECIPIENT
    - APP_LOG_MAIL_SUBJECT
    - APP_LOG_MAIL_SENDER
    - APP_LOG_MAIL_LEVEL
---
SilverStripe\Core\Injector\Injector:
  Psr\Log\LoggerInterface:
    calls:
      MailHandler: [ pushHandler, [ '%$MailHandler' ] ]

  # Email template for error notifications (env vars resolved by Injector)
  ErrorNotificationEmail:
    class: SilverStripe\Control\Email\Email
    # 'from' MUST be passed as the FIRST CONSTRUCTOR ARG, not via calls: setFrom.
    # Email::__construct() runs setFrom($from ?: getDefaultFrom()) itself — so a
    # `calls: setFrom` override happens too late: the constructor already resolved the
    # default. And getDefaultFrom() falls back to no-reply@<Director::host()>, which is
    # RFC-invalid when the request Host is malformed (trailing-dot FQDN from a scanner)
    # AND admin_email is empty (it can be, during early-bootstrap error logging) — a
    # FATAL that turns any error into a 500 (see admintweaks#56). Passing 'from' to the
    # constructor skips getDefaultFrom() entirely, removing the dependency on both
    # admin_email timing and the request host.
    constructor:
      - '`APP_LOG_MAIL_SENDER`'
      - '`APP_LOG_MAIL_RECIPIENT`'
      - '`APP_LOG_MAIL_SUBJECT`'

  # DedupSymfonyMailerHandler — sends via Symfony Mailer with cache-based dedup
  # bubble: true — safe because MailHandler is on the standard logger (Psr\Log\LoggerInterface),
  # NOT on the errorhandler logger (which has HTTPOutputHandler). The original bubble:false was
  # to prevent formatted HTML from leaking to HTTPOutputHandler when both were on the same logger.
  # Now they're separate, and bubble:true allows downstream handlers (e.g. SentryHandler) to fire.
  MailHandler:
    class: Restruct\Silverstripe\AdminTweaks\Logging\DedupSymfonyMailerHandler
    constructor:
      - '%$Symfony\Component\Mailer\MailerInterface'
      - '%$ErrorNotificationEmail'
      - '`APP_LOG_MAIL_LEVEL`'
      - true
    properties:
      Formatter: '%$Restruct\Silverstripe\AdminTweaks\Logging\EnhancedErrorFormatter'
