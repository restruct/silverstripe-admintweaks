---
name: admintweaks-leftandmain
---
SilverStripe\Admin\LeftAndMain:
  extensions:
    - Restruct\Silverstripe\AdminTweaks\Extensions\LeftAndMainExtension
  # Load full Bootstrap Icons CSS from CDN for .bi-* button classes
  # Set to true if using Bootstrap Icon classes in the admin
  include_bootstrap_icons: false
  extra_requirements_css:
    - 'restruct/silverstripe-admintweaks:client/dist/css/admintweaks.css'
  extra_requirements_javascript:
    - 'restruct/silverstripe-admintweaks:client/dist/js/admintweaks.js'

# Per-ModelAdmin opt-in tweaks (eg auto_expand_gridfield_search — set the config on your subclass)
SilverStripe\Admin\ModelAdmin:
  extensions:
    - Restruct\Silverstripe\AdminTweaks\Extensions\ModelAdminExtension

# Hiding the CMS sections clients rarely use (Reports, Campaigns) is OPT-IN since 4.1
# (admintweaks#54). Up to 3.x it was hardcoded here:
#
#    SilverStripe\CampaignAdmin\CampaignAdmin:
#      ignore_menuitem: true
#    SilverStripe\Reports\ReportAdmin:
#      ignore_menuitem: true
#
# which a project could only override with `After: '#admintweaks-leftandmain'` on its own
# fragment - same-key scalar config is decided by fragment ORDER, not by project-beats-vendor,
# so the documented `ignore_menuitem: false` silently did nothing without it.
#
# To hide them now, set this once (no After: needed - it is applied at runtime in _config.php):
#
#    SilverStripe\Admin\LeftAndMain:
#      hide_rarely_used_menu_sections: true


# Group some items in the admin menu under 'Advanced' (see: https://github.com/symbiote/silverstripe-grouped-cms-menu)
---
Name: admintweaks-menugroups
Only:
  moduleexists: 'symbiote/silverstripe-grouped-cms-menu'
---
SilverStripe\Admin\LeftAndMain:
  menu_groups:
    Advanced Config:
      icon: 'cog'
      children:
        - SilverStripe-SiteConfig-SiteConfigLeftAndMain
        - SilverStripe-Subsites-Admin-SubsiteAdmin
        - SilverStripe-RedirectedURLs-Admin-RedirectedURLAdmin
        - Restruct-Silverstripe-BlockBase-Admin-BlockAdmin
        - SilverStripe-VersionedAdmin-ArchiveAdmin
        - Symbiote-QueuedJobs-Controllers-QueuedJobsAdmin

SilverStripe\SiteConfig\SiteConfigLeftAndMain:
  menu_priority: -1
Restruct\Silverstripe\BlockBase\Admin\BlockAdmin:
  menu_priority: -2
SilverStripe\VersionedAdmin\ArchiveAdmin:
  menu_priority: -3
SilverStripe\RedirectedURLs\Admin\RedirectedURLAdmin:
  menu_priority: -4
SilverStripe\Subsites\Admin\SubsiteAdmin:
  menu_priority: -5
Symbiote\QueuedJobs\Controllers\QueuedJobsAdmin:
  menu_priority: -6
