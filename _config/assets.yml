---
Name: admintweaks-assets
---
SilverStripe\Assets\File:
  extensions:
    - Restruct\Silverstripe\AdminTweaks\Extensions\FileLocalPathExtension

SilverStripe\Core\Injector\Injector:
#  Intervention\Image\ImageManager:
#    constructor:
#      - { driver: imagick }
  SilverStripe\Assets\Image_Backend:
    properties:
      Quality: 90


# Enable WEBP images if module is installed
# 2026-10-22 (admintweaks#90): gated on the generator CLASS instead of a package name.
# webmen/silverstripe-webp-images is the abandoned old name of wedevelopnl/silverstripe-webp-images
# (Packagist marks it abandoned in favour of the latter); both names ship the same repo, so the old
# moduleexists gate never matched a site that installed the suggested package. The namespace moved
# with the 1.0 release: TheWebmen\WebpImages\Assets\WebpGenerator up to v0.8 (SS4),
# WeDevelop\WebpImages\WebpGenerator from 1.0 (SS4) and 2.x (SS5). Gating on the class works for
# either package name and only sets the properties on the class that is actually installed.
# old:
#---
#Name: admintweaks-assets-webp
#Only:
#  moduleexists: 'webmen/silverstripe-webp-images'
#---
---
Name: admintweaks-assets-webp
Only:
  classexists: 'TheWebmen\WebpImages\Assets\WebpGenerator'
---
SilverStripe\Core\Injector\Injector:
  TheWebmen\WebpImages\Assets\WebpGenerator:
    properties:
      enabled: true
      quality: 80

---
Name: admintweaks-assets-webp-wedevelop
Only:
  classexists: 'WeDevelop\WebpImages\WebpGenerator'
---
SilverStripe\Core\Injector\Injector:
  WeDevelop\WebpImages\WebpGenerator:
    properties:
      enabled: true
      quality: 80


# Checks if file contents roughly match with extension
---
Name: admintweaks-mimeuploadvalidator
After: '#mimeuploadvalidator'
Only:
  moduleexists: 'silverstripe/mimevalidator'
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Assets\Upload_Validator:
    class: SilverStripe\MimeValidator\MimeUploadValidator

