---
Name: admintweaks-password-policy
After: '#corepasswords'
---
# SS6 moved PasswordValidator to SilverStripe\Security\Validation and made the DEFAULT
# implementation EntropyPasswordValidator, which has no MinLength/HistoricCount/MinTestScore.
# Those settings only exist on RulesPasswordValidator, so the service is pointed at it here -
# keeping this module's long-standing rule-based policy rather than silently losing it.
# The old SilverStripe\Security\PasswordValidator FQCN no longer exists in SS6; a stale block
# under it would configure nothing and report nothing (`sake config:audit` catches that class).
SilverStripe\Core\Injector\Injector:
  SilverStripe\Security\Validation\PasswordValidator:
    class: SilverStripe\Security\Validation\RulesPasswordValidator
    properties:
      MinLength: 12
      HistoricCount: 6
      MinTestScore: 3

# In the case someone uses `new RulesPasswordValidator` instead of Injector, provide some safe defaults through config.
SilverStripe\Security\Validation\RulesPasswordValidator:
  min_length: 12
  historic_count: 6
  min_test_score: 3


# Refuse passwords that occur in the Have I Been Pwned breach data (k-anonymity range API: only
# the first 5 characters of the SHA-1 hash leave the server). Switched off outside live below.
# Expiring an already-set breached password at login is opt-in: BreachedPasswords.expire_on_login.
SilverStripe\Security\Validation\PasswordValidator:
  extensions:
    - Restruct\Silverstripe\AdminTweaks\Extensions\BreachedPasswordValidatorExtension
SilverStripe\Security\Member:
  extensions:
    - Restruct\Silverstripe\AdminTweaks\Extensions\BreachedPasswordMemberExtension


# Very permissive password policy on DEV, eg allow admin:admin
---
Name: admintweaks-dev-password-policy
After: '#corepasswords'
Except:
  environment: live
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Security\Validation\PasswordValidator:
    class: SilverStripe\Security\Validation\RulesPasswordValidator
    properties:
      MinLength: 5
      HistoricCount: 0
# Off on dev/test too, so a dev admin:admin is not refused and no request goes out to HIBP.
Restruct\Silverstripe\AdminTweaks\Security\BreachedPasswords:
  enabled: false
