---
Name: admintweaks-minimal-editor
---
# The `minimal` editor config (admintweaks#116), created on the first MinimalEditorConfig::get():
# the getter asks the Injector for MinimalEditorConfig, which this factory answers with a copy
# of the `cms` config.
# Toolbar and options: MinimalEditorConfig.minimal_buttons / minimal_options (see the class).
SilverStripe\Core\Injector\Injector:
  Restruct\Silverstripe\AdminTweaks\Forms\MinimalEditorConfig:
    factory: 'Restruct\Silverstripe\AdminTweaks\Forms\MinimalEditorConfigFactory'
