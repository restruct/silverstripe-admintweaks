# Backport of the SS6 fix for "getRequest() on null when sending emails with no current controller"
# (silverstripe/framework #11678 / PR #11690, admintweaks#59). The framework registers its
# MailerSubscriber by service name in its own _config/mailer.yml (addSubscriber on
# EventDispatcherInterface.mailer), so pointing that service at the subclass swaps it everywhere.
# SS6 REMOVAL NOTE: drop this file (and src/Email/CliSafeMailerSubscriber.php) on the SS6 line.
# Only: classexists keeps this inert on SS4 (this 3.x line allows framework ^4 | ^5, and SS4 has no
# MailerSubscriber). SS6 cannot install 3.x at all; the SS6 line (main) requires framework ^6.
---
Name: admintweaks-mailersubscriber
After:
  - '#mailer'
Only:
  classexists: 'SilverStripe\Control\Email\MailerSubscriber'
---
SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Email\MailerSubscriber:
    class: Restruct\Silverstripe\AdminTweaks\Email\CliSafeMailerSubscriber
