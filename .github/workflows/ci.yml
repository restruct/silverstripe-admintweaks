name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: SS${{ matrix.silverstripe }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # This branch is the Silverstripe 6 line only; the 4/5 line lives on its own branch
          # with its own workflow. PHP floor and ceiling of the declared constraint.
          - silverstripe: '6'
            php: '8.3'
            recipe: '^6'
            testing: '^4'
          - silverstripe: '6'
            php: '8.4'
            recipe: '^6'
            testing: '^4'

    services:
      database:
        # MariaDB rather than MySQL: it matches both the local dev machines and the Forge
        # servers, so a version-specific failure here means something real.
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ss_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Check out the module
        uses: actions/checkout@v4
        with:
          path: module

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, mysqli, gd, zip, dom, xml, tokenizer, simplexml, ctype, hash, session
          tools: composer:v2
          coverage: none

      - name: Build a host project
        # The module cannot be tested on its own: it needs a booted Silverstripe app. It is
        # required through a PATH repository pointing at the checkout, and symlinked rather
        # than mirrored so the tests come along even if /tests is ever made export-ignore.
        #
        # queuedjobs is installed because QueuedJobContextExtension hooks its descriptor, and
        # reports because the #54 menu tests need a real ReportAdmin to hide.
        run: |
          mkdir -p app-host
          cd app-host
          cat > composer.json <<JSON
          {
            "name": "restruct/ci-host",
            "require": {
              "silverstripe/recipe-cms": "${{ matrix.recipe }}",
              "silverstripe/recipe-testing": "${{ matrix.testing }}",
              "symbiote/silverstripe-queuedjobs": "^6",
              "restruct/silverstripe-admintweaks": "*"
            },
            "repositories": [
              { "type": "path", "url": "../module", "options": { "symlink": true } }
            ],
            "autoload-dev": {
              "psr-4": {
                "Restruct\\\\Silverstripe\\\\AdminTweaks\\\\Tests\\\\": "vendor/restruct/silverstripe-admintweaks/tests/"
              }
            },
            "minimum-stability": "dev",
            "prefer-stable": true,
            "config": { "allow-plugins": true }
          }
          JSON
          composer update --no-interaction --no-progress

      - name: Configure the test suite
        run: |
          cd app-host
          cat > phpunit.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Warning-to-error escalation is the RUNNER's behaviour and differs by PHPUnit
               major: 9 (SS5) converts warnings by default, 11 (SS6) has no such attribute.
               failOnWarning is pinned so a warning behaves identically on every leg. -->
          <phpunit bootstrap="vendor/silverstripe/framework/tests/bootstrap.php" colors="true"
                   failOnWarning="true">
              <testsuites>
                  <testsuite name="admintweaks">
                      <directory>vendor/restruct/silverstripe-admintweaks/tests</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          XML

      - name: Run tests
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
          # PHPUnit 11 ignores a `flush=1` argument, so the manifest is flushed through this.
          SS_PHPUNIT_FLUSH: 1
        run: vendor/bin/phpunit --testsuite admintweaks

      - name: Boot the app and build the database
        # The suite proves the classes behave; this proves the module does not break a real
        # boot - the failure mode that took this module's previous SS6 attempt down was a
        # bootstrap fatal, which no unit test would have caught.
        working-directory: app-host
        env:
          SS_DATABASE_CLASS: MySQLDatabase
          SS_DATABASE_SERVER: 127.0.0.1
          SS_DATABASE_PORT: 3306
          SS_DATABASE_USERNAME: root
          SS_DATABASE_PASSWORD: root
          SS_DATABASE_NAME: ss_ci
          SS_ENVIRONMENT_TYPE: dev
        run: |
          vendor/bin/sake db:build --flush
          # Reports YAML still keyed to classes that no longer exist (SS6 catches these here).
          vendor/bin/sake config:audit

  lint:
    name: Lint PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the module's declared php constraint.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax check every PHP file
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
